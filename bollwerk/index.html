<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1c2236" />
    <title>Bollwerk</title>
    <meta name="description" content="Bollwerk – tower defense on floating islands." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4 56 16v18c0 14-10 23-24 26C18 57 8 48 8 34V16Z' fill='%233fb7a6'/%3E%3Cpath d='M32 14l6 14h-12z' fill='%23e8fffb'/%3E%3Ccircle cx='32' cy='38' r='8' fill='%23e8fffb'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <canvas id="overlay"></canvas>
      <div id="vignette" aria-hidden="true"></div>

      <!-- Spiel-HUD -->
      <div id="hud" class="hidden">
        <div class="hud-tl">
          <div class="pill lives" data-i18n-title="ui.hud.lives"><span class="ico heart"></span><b id="lives">20</b></div>
          <div class="pill coins" data-i18n-title="ui.hud.coins"><span class="ico coin"></span><b id="coins">0</b></div>
          <div class="pill wave" data-i18n-title="ui.hud.wave"><span class="label" data-i18n="ui.hud.waveLabel"></span><b id="wave">0</b><span class="goal" id="goal">/20</span></div>
        </div>

        <div class="hud-tr">
          <div class="seg" id="speed" role="group">
            <button data-speed="1" class="on" data-i18n-title="ui.hud.speed1">1×</button>
            <button data-speed="2" data-i18n-title="ui.hud.speed2">2×</button>
            <button data-speed="3" data-i18n-title="ui.hud.speed3">3×</button>
          </div>
          <button class="icon-btn" id="btn-pause" data-i18n-title="ui.hud.pause">❚❚</button>
          <button class="icon-btn" id="btn-sound" data-i18n-title="ui.hud.sound">♪</button>
          <button class="icon-btn" id="btn-view" data-i18n-title="ui.hud.view">⌖</button>
          <button class="icon-btn" id="btn-menu" data-i18n-title="ui.hud.menu">☰</button>
        </div>

        <div class="wave-card" id="wave-card">
          <div class="wave-head">
            <span id="wave-title"></span>
            <span class="timer" id="wave-timer"></span>
          </div>
          <div class="wave-list" id="wave-list"></div>
          <button class="primary small" id="btn-wave"></button>
        </div>

        <div class="boss-bar hidden" id="boss-bar">
          <div class="boss-name"><span id="boss-name"></span><small id="boss-ability"></small></div>
          <div class="boss-track"><i id="boss-shield"></i><i id="boss-hp"></i></div>
        </div>

        <div class="abilities" id="abilities"></div>
        <div class="build-bar" id="build-bar"></div>
        <aside class="inspector hidden" id="inspector"></aside>
        <div class="toasts" id="toasts"></div>
        <div class="hint hidden" id="hint"></div>
      </div>

      <!-- Hauptmenü -->
      <section class="screen" id="menu">
        <div class="menu-wrap">
          <header class="title">
            <div class="crest" aria-hidden="true"></div>
            <div>
              <h1>Bollwerk</h1>
              <p data-i18n="ui.tagline"></p>
            </div>
            <button class="crystal-pill" id="btn-research-top">
              <span class="ico crystal"></span><b id="menu-crystals">0</b><span data-i18n="ui.menu.research"></span>
            </button>
          </header>
          <div class="maps" id="map-list"></div>
          <div class="menu-actions">
            <button class="primary violet" id="btn-research" data-i18n="ui.menu.research"></button>
            <button class="ghost" id="btn-codex" data-i18n="ui.menu.codex"></button>
            <button class="ghost" id="btn-help" data-i18n="ui.menu.help"></button>
            <button class="ghost" id="btn-settings" data-i18n="ui.menu.settings"></button>
          </div>
        </div>
      </section>

      <!-- Pause -->
      <section class="screen dim hidden" id="pause">
        <div class="card">
          <h2 data-i18n="ui.pause.title"></h2>
          <div class="stack">
            <button class="primary" id="btn-resume" data-i18n="ui.pause.resume"></button>
            <button class="ghost" id="btn-restart" data-i18n="ui.pause.restart"></button>
            <button class="ghost" id="btn-codex2" data-i18n="ui.pause.codex"></button>
            <button class="ghost" id="btn-quit" data-i18n="ui.pause.quit"></button>
          </div>
        </div>
      </section>

      <!-- Ende -->
      <section class="screen dim hidden" id="end">
        <div class="card">
          <h2 id="end-title"></h2>
          <p class="sub" id="end-text"></p>
          <div class="end-stats" id="end-stats"></div>
          <p class="crystal-gain" id="end-crystals"></p>
          <div class="row" id="end-actions"></div>
        </div>
      </section>

      <!-- Forschung -->
      <section class="screen dim hidden" id="research">
        <div class="card wide research-card">
          <div class="codex-head">
            <div>
              <h2 data-i18n="ui.research.title"></h2>
              <p class="sub" data-i18n="ui.research.sub"></p>
            </div>
            <div class="crystal-pill static"><span class="ico crystal"></span><b id="research-crystals">0</b></div>
          </div>
          <div class="tree" id="tree"></div>
          <div class="row">
            <span class="spent" id="research-spent"></span>
            <button class="ghost" id="btn-research-refund" data-i18n="ui.research.refund"></button>
            <button class="primary" id="btn-research-close" data-i18n="ui.research.done"></button>
          </div>
        </div>
      </section>

      <!-- Almanach -->
      <section class="screen dim hidden" id="codex">
        <div class="card wide">
          <div class="codex-head">
            <h2 data-i18n="ui.codex.title"></h2>
            <div class="seg" id="codex-tabs">
              <button data-tab="towers" class="on" data-i18n="ui.codex.towers"></button>
              <button data-tab="enemies" data-i18n="ui.codex.enemies"></button>
              <button data-tab="rules" data-i18n="ui.codex.rules"></button>
            </div>
            <button class="icon-btn" id="btn-codex-close" data-i18n-title="ui.insp.close">✕</button>
          </div>
          <div class="codex-body" id="codex-body"></div>
        </div>
      </section>

      <!-- Einstellungen -->
      <section class="screen dim hidden" id="settings">
        <div class="card">
          <h2 data-i18n="ui.settings.title"></h2>
          <label class="opt"><span data-i18n="ui.settings.language"></span>
            <select id="opt-lang"><option value="en">English</option><option value="de">Deutsch</option></select>
          </label>
          <label class="opt"><span data-i18n="ui.settings.graphics"></span>
            <select id="opt-quality"><option value="high" data-i18n="ui.settings.high"></option><option value="low" data-i18n="ui.settings.low"></option></select>
          </label>
          <label class="opt"><span data-i18n="ui.settings.unlockAll"></span><input type="checkbox" id="opt-unlock" /></label>
          <label class="opt"><span data-i18n="ui.settings.numbers"></span><input type="checkbox" id="opt-numbers" checked /></label>
          <div class="row"><button class="ghost" id="btn-reset" data-i18n="ui.settings.reset"></button><button class="primary" id="btn-settings-close" data-i18n="ui.settings.done"></button></div>
        </div>
      </section>

      <!-- Hilfe -->
      <section class="screen dim hidden" id="help">
        <div class="card">
          <h2 data-i18n="ui.help.title"></h2>
          <table class="keys" id="help-table"></table>
          <div class="row"><button class="primary" id="btn-help-close" data-i18n="ui.help.ok"></button></div>
        </div>
      </section>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
